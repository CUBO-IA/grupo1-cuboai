const KEY='wiener-kingdom-v1-demo';let s;try{s=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){s={}}s.products=Array.isArray(s.products)?s.products:INITIAL;s.cart=Array.isArray(s.cart)?s.cart:[];s.orders=Array.isArray(s.orders)?s.orders:[];s.rules=Array.isArray(s.rules)?s.rules:[{id:1,title:'Avisar cuando entra un pedido pagado',enabled:true},{id:2,title:'Notificar stock inferior a 5 unidades',enabled:true},{id:3,title:'Enviar resumen operativo semanal (simulado)',enabled:false}];s.store=s.store||'Wiener Kingdom · Studio demo';let view='market',category='Todas',searchText='',chat=[{role:'ai',text:'¡Hola! Soy el asistente de demostración WIENER KINGDOM. Puedo ayudarte a explorar productos o explicar cómo funcionaría una compra. No estoy conectado a una IA real, a Smart Fit del servidor ni a pedidos de la tienda Django.'}];
function save(){localStorage.setItem(KEY,JSON.stringify(s));document.getElementById('cartNum').textContent=s.cart.reduce((a,b)=>a+b.qty,0)}
function money(n){return '$'+Number(n||0).toFixed(2)}function esc(t){return String(t??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]))}function notify(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),3100)}const REAL_IMAGES=["wedding-dog.jpg", "tactical-dog.jpg", "christmas-dog.jpg", "alnut-whip-1.jpg", "beige-harness-1.jpg", "tutti-frutti-1.jpg", "cable-knit-jumper-1.jpg", "drying-robe-1.jpg"];function imageUrl(p){return "https://raw.githubusercontent.com/CUBO-IA/grupo1-cuboai/main/web/static/tienda/img/"+REAL_IMAGES[(p.img||8)-1]}
function route(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('app').innerHTML=({market:renderMarket,studio:renderStudio,pulse:renderPulse,flow:renderFlow,assist:renderAssist}[v]||renderMarket)();window.scrollTo({top:0,behavior:'smooth'});save();if(v==='assist')paintChat()}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.view)));
function hero(){return `<section class="hero wk-hero"><div class="hero-body"><div class="micro">WIENER KINGDOM · BESPOKE DACHSHUND CLUB</div><h1>Pequeños de tamaño.<br><em>Realeza</em><br>de corazón.</h1><p>Prendas y accesorios con personalidad para dachshunds. Descubre el estilo que les queda, explora Smart Fit y conoce el siguiente capítulo del comercio digital.</p><div class="buttons"><button class="primary" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Descubrir colección ↗</button><button class="secondary" onclick="route('studio')">Explorar Studio →</button></div><p class="wk-hero-small">Prototipo visual independiente. La tienda del equipo continúa operando en Django.</p></div><div class="hero-art"><div class="art-orbit"></div><div class="wk-dog-hero"><img src="assets/smartfit-editorial.png" alt="Visual editorial premium del concepto Smart Fit. Su sistema real sigue en Django"/></div></div></section>`}
function prodCard(p){return `<article class="product"><div class="product-img"><img src="${imageUrl(p)}" onerror="this.onerror=null;this.src='assets/product-fallback-${p.img||8}.jpg';this.alt='Tarjeta editorial conceptual, no fotografía del producto'" alt="Fotografía de referencia del catálogo existente: ${esc(p.name)}"/><span class="float-label">${esc(p.tag||'WIENER KINGDOM')}</span></div><div class="pbody"><div class="mini">${esc(p.cat)}</div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="price"><strong>${money(p.price)}</strong><button class="plus" ${p.stock<1?'disabled':''} aria-label="Agregar ${esc(p.name)} al carrito" onclick="add(${p.id})">+</button></div></div></article>`}
function renderMarket(){let arr=s.products.filter(p=>(category==='Todas'||p.cat===category)&&(!searchText||p.name.toLowerCase().includes(searchText.toLowerCase())));let cats=['Todas',...new Set(s.products.map(p=>p.cat))];return hero()+`<div class="ticker"><span><i class="tick"></i> Diseñado para dachshunds</span><span><i class="tick"></i> Smart Fit y cotización</span><span><i class="tick"></i> Estilo con propósito</span><span><i class="tick"></i> Crecer sin improvisar</span></div><section id="catalog"><div class="sectionhead"><div><div class="micro">WIENER KINGDOM MARKET</div><h2>La colección real, reinventada</h2><p>Nombres y precios base de referencia tomados del catálogo del equipo. Fotografías originales del catálogo cuando hay conexión; sin conexión se muestran tarjetas conceptuales. Precios y existencias de prueba.</p></div><label class="search">⌕ <input aria-label="Buscar productos" placeholder="Busca su próximo estilo..." id="searchInput" value="${esc(searchText)}" oninput="searchProducts(this.value)"/></label></div><div class="categorybar">${cats.map(c=>`<button class="chip ${c===category?'sel':''}" onclick="chooseCat('${esc(c)}')">${esc(c)}</button>`).join('')}</div><div class="grid4" id="productGrid">${arr.length?arr.map(prodCard).join(''):'<p>No encontramos productos con esos filtros.</p>'}</div></section><section class="features"><div class="sectionhead"><div><div class="micro">UN SISTEMA CONECTADO</div><h2>Mucho más que una tienda.</h2></div></div><div class="featgrid"><div class="feature"><div class="ico">◈</div><h3>Ajuste con intención</h3><p>Smart Fit recopila medidas y Smart Quote genera una cotización provisional, que requiere confirmación del equipo.</p></div><div class="feature"><div class="ico">▣</div><h3>Operación con criterio</h3><p>El backend existente ya administra pedidos, pagos manuales, estados y costos. Studio muestra hacia dónde puede crecer.</p></div><div class="feature"><div class="ico">✦</div><h3>Asistencia honesta</h3><p>El asistente actual del equipo usa reglas de catálogo. Aquí mostramos la evolución futura, sin fingir una IA conectada.</p></div></div></section>`}
function chooseCat(c){category=c;route('market');document.getElementById('catalog').scrollIntoView({block:'start'})}function searchProducts(t){searchText=t;const arr=s.products.filter(p=>(category==='Todas'||p.cat===category)&&p.name.toLowerCase().includes(t.toLowerCase()));document.getElementById('productGrid').innerHTML=arr.length?arr.map(prodCard).join(''):'<p>No se encontraron productos.</p>'}
function add(id){const p=s.products.find(x=>x.id===id);if(!p||p.stock<1)return;const item=s.cart.find(x=>x.id===id);if(item){if(item.qty>=p.stock)return notify('No hay más inventario simulado');item.qty++}else s.cart.push({id,qty:1});save();notify(p.name+' agregado al carrito')}
function openCart(){const items=s.cart.map(c=>({c,p:s.products.find(x=>x.id===c.id)})).filter(x=>x.p);const total=items.reduce((a,x)=>a+x.p.price*x.c.qty,0);document.getElementById('cartDrawer').innerHTML=`<button class="close" aria-label="Cerrar carrito" onclick="closeCart()">×</button><div class="micro">WIENER KINGDOM MARKET</div><h2>Tu carrito</h2><p class="muted">Compra simulada. No se solicita información de tarjeta.</p>${items.length?items.map(({p,c})=>`<div class="drawrow"><img src="${imageUrl(p)}" alt="${esc(p.name)}"/><div style="flex:1"><b>${esc(p.name)}</b><small>${money(p.price)}</small><div class="count"><button onclick="chg(${p.id},-1)">−</button>${c.qty}<button onclick="chg(${p.id},1)">+</button></div></div><b>${money(p.price*c.qty)}</b></div>`).join(''):'<div class="empty">Todavía no tienes productos.</div>'}<div class="total"><span>Subtotal</span><span>${money(total)}</span></div><div class="hint">El total no incluye entregas ni impuestos. En la tienda operativa de Django la cotización es provisional y el equipo debe confirmar el importe final antes del cobro.</div><button class="primary" style="width:100%" ${items.length?'':'disabled'} onclick="checkout()">Continuar a checkout demo</button><button class="secondary" style="width:100%;margin-top:10px" onclick="closeCart()">Seguir explorando</button>`;document.getElementById('cartBack').classList.add('show')}
function closeCart(){document.getElementById('cartBack').classList.remove('show')}
function chg(id,n){let c=s.cart.find(x=>x.id===id);let p=s.products.find(x=>x.id===id);if(c){c.qty=Math.min(p.stock,c.qty+n);if(c.qty<=0)s.cart=s.cart.filter(x=>x!==c)}save();openCart()}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function checkout(){closeCart();document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="micro">CHECKOUT SIMULADO</div><h2 style="font-size:30px;margin:9px 0">Finalizar pedido de prueba</h2><div class="notice"><strong>Sin dinero real:</strong> no ingreses datos de tarjeta ni información personal sensible. Esta prueba solo guarda el pedido en tu navegador.</div><form class="form" onsubmit="event.preventDefault();placeOrder(this)"><label>Alias del cliente de prueba</label><input name="alias" required maxlength="50" placeholder="Cliente demo"/><label>Ciudad de referencia</label><select name="city"><option>San Salvador</option><option>La Libertad</option><option>Santa Tecla</option><option>Otra región (demo)</option></select><label>Método de pago</label><select name="payment"><option>Pago ficticio de sandbox</option><option>Bitcoin (vista conceptual, no conectado)</option><option>Tarjeta (vista conceptual, no conectada)</option></select><button class="primary" type="submit" style="width:100%">Confirmar pedido simulado</button></form>`;document.getElementById('modalBack').classList.add('show')}
function placeOrder(form){const alias=form.elements.alias.value.trim();if(!alias||s.cart.length===0)return;for(const c of s.cart){const p=s.products.find(x=>x.id===c.id);if(!p||p.stock<c.qty)return notify('Inventario insuficiente, revisa el carrito')}const total=s.cart.reduce((a,c)=>a+s.products.find(x=>x.id===c.id).price*c.qty,0);for(const c of s.cart)s.products.find(x=>x.id===c.id).stock-=c.qty;const id='WK-'+String(Date.now()).slice(-7);s.orders.unshift({id,alias,city:form.elements.city.value,total,qty:s.cart.reduce((a,b)=>a+b.qty,0),status:'Pagado (simulado)',created:new Date().toLocaleDateString('es-SV')});s.cart=[];save();document.getElementById('modal').innerHTML=`<div class="micro">ORDEN DE PRUEBA CREADA</div><h2 style="font-size:35px;margin:13px 0">¡Listo! ✓</h2><p>Registramos el pedido <b>${id}</b> únicamente en este navegador. No se procesó dinero ni se solicitó entrega.</p><div class="hint">Total simulado: <b>${money(total)}</b> · Ciudad: ${esc(form.elements.city.value)}</div><button class="primary" onclick="closeModal();route('studio')">Ver en panel de pedidos →</button>`}
function renderStudio(){return `<section class="panel-title"><div><div class="micro">WIENER KINGDOM STUDIO / SELLER OS</div><h1>Tu reino, bajo control.</h1><p>Administra productos y pedidos simulados desde un único lugar.</p></div><button class="secondary" onclick="resetDemo()">↺ Reiniciar demo</button></section><div class="stats"><div class="stat"><div class="k">Órdenes registradas</div><strong>${s.orders.length}</strong><small>En este navegador</small></div><div class="stat"><div class="k">Ventas simuladas</div><strong>${money(s.orders.reduce((a,x)=>a+x.total,0))}</strong><small>No son ingresos reales</small></div><div class="stat"><div class="k">Productos de ejemplo</div><strong>${s.products.length}</strong><small>Productos ilustrativos</small></div><div class="stat"><div class="k">Unidades en stock</div><strong>${s.products.reduce((a,p)=>a+p.stock,0)}</strong><small>Inventario local</small></div></div><div class="split"><div class="paper"><h3>Productos de la tienda</h3><div style="overflow:auto"><table class="datatbl"><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th></th></tr></thead><tbody>${s.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td><span class="pill ${p.stock<5?'orange':''}">${p.stock}</span></td><td><button class="secondary" onclick="restock(${p.id})" style="padding:6px 10px;font-size:11px">+5</button></td></tr>`).join('')}</tbody></table></div></div><div class="paper"><h3>Crear un producto de prueba</h3><p>Simula cómo un vendedor amplía su catálogo.</p><form class="form" onsubmit="event.preventDefault();newProduct(this)"><label>Nombre</label><input name="name" maxlength="55" required placeholder="Nuevo producto"/><label>Categoría</label><select name="cat"><option>Arneses</option><option>Abrigo</option><option>Accesorios</option></select><label>Precio USD</label><input name="price" type="number" min="1" step="0.01" max="100000" required placeholder="45.00"/><label>Unidades disponibles</label><input name="stock" type="number" min="0" step="1" max="9999" required value="10"/><button class="primary" type="submit">+ Añadir al catálogo</button></form></div></div><div class="paper" style="margin-top:20px"><h3>Centro de pedidos</h3><div class="notice">Estos pedidos no existen en un servidor. Solo son ejemplos almacenados localmente para practicar el flujo operativo.</div><div style="overflow:auto"><table class="datatbl"><thead><tr><th>Orden</th><th>Cliente</th><th>Destino</th><th>Artículos</th><th>Total</th><th>Estado</th></tr></thead><tbody>${s.orders.length?s.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.alias)}</td><td>${esc(o.city)}</td><td>${o.qty}</td><td>${money(o.total)}</td><td><span class="pill">${esc(o.status)}</span></td></tr>`).join(''):'<tr><td colspan="6">Sin pedidos aún. Agrega un producto al carrito desde Marketplace y haz un checkout simulado.</td></tr>'}</tbody></table></div></div>`}
function restock(id){s.products.find(x=>x.id===id).stock+=5;save();route('studio');notify('Se agregaron 5 unidades de prueba')}
function newProduct(f){const p={id:Date.now(),name:f.elements.name.value.trim(),cat:f.elements.cat.value,price:Number(f.elements.price.value),stock:Number(f.elements.stock.value),tag:'Tu producto',desc:'Artículo creado únicamente en la demostración local, no en la tienda Django.',img:8};s.products.push(p);save();route('studio');notify('Producto creado en tu demo')}
function resetDemo(){if(!confirm('¿Reiniciar todos los datos locales de esta demostración?'))return;localStorage.removeItem(KEY);location.reload()}
function renderPulse(){let rev=s.orders.reduce((a,o)=>a+o.total,0);return `<section class="panel-title"><div><div class="micro">WIENER KINGDOM PULSE / BUSINESS INTELLIGENCE</div><h1>Decisiones con perspectiva.</h1><p>Analítica conceptual: gráficos históricos ilustrativos y datos de pedidos locales marcados claramente.</p></div></section><div class="notice">Los gráficos de tendencia muestran <b>datos ficticios</b>. Las cifras de órdenes locales proceden de esta demostración y tampoco representan ventas de una empresa.</div><div class="stats"><div class="stat"><div class="k">Venta local simulada</div><strong>${money(rev)}</strong><small>Pedidos registrados en el navegador</small></div><div class="stat"><div class="k">Ticket promedio</div><strong>${money(s.orders.length?rev/s.orders.length:0)}</strong><small>Solo órdenes de prueba</small></div><div class="stat"><div class="k">Conversión</div><strong>3.8%</strong><small>Dato ilustrativo</small></div><div class="stat"><div class="k">Satisfacción</div><strong>96%</strong><small>Dato ilustrativo</small></div></div><div class="dashgrid"><div class="paper"><h3>Tendencia de ingresos <small class="muted">(escenario de ejemplo)</small></h3><svg class="chart" viewBox="0 0 680 300" role="img" aria-label="Gráfico ilustrativo de ingresos crecientes"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#3078A3" stop-opacity=".27"/><stop offset="1" stop-color="#3078A3" stop-opacity="0"/></linearGradient></defs>${[55,110,165,220].map(y=>`<line x1="40" y1="${y}" x2="658" y2="${y}" stroke="#e7eef3"/>`).join('')}<path d="M40 216 C90 201,110 210,150 177 S220 189,265 142 S330 170,380 124 S470 131,510 86 S590 103,650 44 L650 260 L40 260 Z" fill="url(#g)"/><path d="M40 216 C90 201,110 210,150 177 S220 189,265 142 S330 170,380 124 S470 131,510 86 S590 103,650 44" fill="none" stroke="#3078A3" stroke-width="5" stroke-linecap="round"/>${['Ene','Feb','Mar','Abr','May','Jun'].map((m,i)=>`<text x="${55+i*110}" y="288" font-size="13" fill="#8396A9">${m}</text>`).join('')}</svg></div><div class="paper"><h3>Origen de compradores <small class="muted">(ejemplo)</small></h3>${[['Búsqueda orgánica',56],['Comunidad y redes',28],['Referidos',12],['Otro',4]].map(([k,n])=>`<div class="barrow"><span>${k}</span><span>${n}%</span></div><div class="bar"><i style="width:${n}%"></i></div>`).join('')}<p>En producción, cada métrica tendrá definición, fuente, intervalo y responsable.</p></div></div>`}
function renderFlow(){return `<section class="panel-title"><div><div class="micro">WIENER KINGDOM FLOW / AUTOMATION LAB</div><h1>Menos tareas, más creatividad.</h1><p>Diseña reglas operativas; esta versión solo simula su activación y no envía mensajes.</p></div></section><div class="split"><div class="paper"><h3>Reglas de automatización</h3>${s.rules.map(x=>`<div class="cardrow"><div><b>${esc(x.title)}</b><small style="display:block;margin-top:6px">ID ${x.id} · Entorno de demostración</small></div><button aria-label="${x.enabled?'Desactivar':'Activar'} regla" class="switch ${x.enabled?'on':''}" onclick="toggleRule(${x.id})"></button></div>`).join('')}<button class="secondary" onclick="simulateRule()" style="margin-top:20px">▶ Simular evento</button></div><div class="paper"><h3>Nueva regla</h3><p>Combina un evento con una acción sin escribir código.</p><form class="form" onsubmit="event.preventDefault();newRule(this)"><label>Cuando suceda</label><select name="ev"><option>Un pedido se confirme</option><option>Un artículo tenga poco stock</option><option>Se abra un ticket</option></select><label>Entonces</label><select name="act"><option>Crear tarea para el equipo</option><option>Proponer una notificación</option><option>Marcarlo en el dashboard</option></select><button class="primary">+ Guardar regla demo</button></form><div class="hint">En producción, cada ejecución tendrá permisos, registro, reintentos y aprobación si cambia datos importantes.</div></div></div>`}
function toggleRule(id){let x=s.rules.find(r=>r.id===id);x.enabled=!x.enabled;save();route('flow')}function newRule(f){s.rules.push({id:Date.now(),title:f.elements.ev.value+' → '+f.elements.act.value,enabled:true});save();route('flow');notify('Regla de prueba creada')}function simulateRule(){notify('Evento simulado: '+s.rules.filter(x=>x.enabled).length+' reglas activas. No se ejecutó ninguna acción externa.')}
function renderAssist(){return `<section class="panel-title"><div><div class="micro">WIENER KINGDOM ASSIST / HUMAN + AI</div><h1>Cada consulta merece atención.</h1><p>Prueba respuestas predefinidas de la demo. Un agente de IA real requerirá un backend seguro, fuentes y evaluaciones.</p></div></section><div class="chatwrap"><div class="chathead"><div class="avatar">✦</div><div><b>WIENER KINGDOM Concierge</b><div style="font-size:11px;color:#b9cbda;margin-top:3px">Modo demo · respuestas predefinidas · sin datos externos</div></div></div><div class="chatlog" id="chatlog"></div><div class="suggests">${['¿Cómo compro?','¿Cuándo llega mi pedido?','Necesito una persona','¿Aceptan Bitcoin?'].map(x=>`<button onclick="ask('${x}')">${x}</button>`).join('')}</div><form class="composer" onsubmit="event.preventDefault();ask(document.getElementById('ask').value);document.getElementById('ask').value='' "><input id="ask" aria-label="Escribir mensaje" maxlength="220" placeholder="Escribe una pregunta..."/><button class="primary">Enviar</button></form></div>`}
function paintChat(){const el=document.getElementById('chatlog');if(!el)return;el.innerHTML=chat.map(x=>`<div class="bubble ${x.role==='user'?'user':''}">${esc(x.text)}<small>${x.role==='user'?'Tú':'Asistente demo'}</small></div>`).join('');el.scrollTop=el.scrollHeight}
function ask(q){q=String(q||'').trim();if(!q)return;chat.push({role:'user',text:q});let t=q.toLowerCase();let answer=t.includes('bitcoin')?'La tienda del equipo ofrece una opción manual Bitcoin con descuento condicionado a verificación; esta demostración local no recibe ni verifica fondos.':t.includes('persona')||t.includes('humano')||t.includes('reembolso')?'El sistema real transferiría tu caso a un agente humano con el contexto permitido. Aquí no existe una bandeja de atención conectada, así que la transferencia solo se muestra como concepto.':t.includes('pedido')||t.includes('llega')?'Puedes crear y consultar pedidos ficticios desde el Marketplace y el panel Studio. No hay entregas reales ni números de seguimiento externos.':t.includes('compr')?'Explora la colección, añade artículos al carrito y completa el formulario de checkout de prueba. No se procesan pagos ni envíos.':'Puedo orientarte sobre el catálogo demo, compra simulada, envíos conceptuales y las funciones de WIENER KINGDOM. Si necesitas resolver una operación real, esta versión aún no la soporta.';chat.push({role:'ai',text:answer});paintChat()}
save();route('market');
</script></body></html>
