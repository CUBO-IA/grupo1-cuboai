{% extends "reino/base.html" %}
{% block content %}
<div class="panel-layout">
    <nav class="panel-nav" aria-label="Panel del comerciante">
        <a href="{% url 'reino_merchant' store.slug %}" {% if request.resolver_match.url_name == "reino_merchant" %}aria-current="page"{% endif %}>Resumen</a>
        <a href="{% url 'reino_merchant_catalog' store.slug %}" {% if request.resolver_match.url_name == "reino_merchant_catalog" %}aria-current="page"{% endif %}>Catálogo</a>
        <a href="{% url 'reino_merchant_orders' store.slug %}" {% if "orders" in request.resolver_match.url_name or "order" in request.resolver_match.url_name %}aria-current="page"{% endif %}>Pedidos</a>
        <a href="{% url 'reino_merchant_settings' store.slug %}" {% if request.resolver_match.url_name == "reino_merchant_settings" %}aria-current="page"{% endif %}>Configuración</a>
        <a href="{% url 'reino_store_home' store.slug %}" style="opacity:.7">← Ver tienda</a>
    </nav>
    <div class="panel-main">
        {% block panel %}{% endblock %}
    </div>
</div>
{% endblock %}
